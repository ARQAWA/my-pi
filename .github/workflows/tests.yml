name: tests

on:
  push:
    # Proof comes from the task branch head on current main; its squash has the same tree (PROCESS.md, Delivery).
    # `codemode-stress` only carries a head for codemode-stress.yml.
    branches-ignore: [main, codemode-stress]
    # Docs-only pushes run no tests: root *.md, notes/ and .agents/ carry no code the tests load.
    paths-ignore: ['*.md', 'notes/**', '.agents/**']
  # Full regression on main every 2 h. Minute 17 avoids the top-of-hour load where GitHub documents dropped
  # schedule runs. A schedule runs only on the default branch.
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      qa_canary:
        description: One macOS job also runs a deliberately failing test, to prove the failure inbox end to end
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Keep the matrix label stable for evidence artifacts and the QA canary.
          node-version: ${{ matrix.node == '24' && '>=24.22.0 <25' || matrix.node }}

      - name: Facts
        run: |
          node --version
          git --version
          command -v bash rg fd || true

      - name: Facts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          where.exe bash.exe
          ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole('Administrators')

      - run: npm ci

      # Crash reports newer than this mark belong to this job.
      - name: Evidence mark
        run: mkdir -p "$RUNNER_TEMP/evidence" && touch "$RUNNER_TEMP/evidence/.start"

      # npm test with a TAP copy for the evidence (scripts/ci-npm-test.sh); the log output stays Node's default.
      - name: npm test
        run: bash scripts/ci-npm-test.sh "$RUNNER_TEMP/evidence/npm-test.tap"

      - name: Tests in a path with spaces and Cyrillic
        run: |
          DIR="$RUNNER_TEMP/проба с пробелом"
          mkdir -p "$DIR"
          cp -R "$GITHUB_WORKSPACE" "$DIR/my-pi"
          cd "$DIR/my-pi"
          pwd
          bash scripts/ci-npm-test.sh "$RUNNER_TEMP/evidence/npm-test-path-with-spaces.tap"

      # A test file whose process died shows its exitCode and signal in the TAP copy; a native crash or a memory
      # kill on macOS leaves a report in DiagnosticReports (JetsamEvent-*.ips for a memory kill).
      - name: Collect crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            find "$d" -name '*.ips' -newer "$RUNNER_TEMP/evidence/.start" -exec cp {} "$RUNNER_TEMP/evidence/" \; 2>/dev/null || true
          done
          ls -la "$RUNNER_TEMP/evidence"

      # Canary: test/fixtures/qa-canary/canary.test.mjs fails on purpose and is not in the npm test globs. The job then
      # fails with TAP evidence and "Upload evidence" below ships it, so the inbox can be proven end to end.
      - name: QA canary (deliberate failure)
        if: ${{ inputs.qa_canary && matrix.os == 'macos-latest' && matrix.node == '24' }}
        run: node --test --test-reporter=spec --test-reporter=tap --test-reporter-destination=stdout --test-reporter-destination="$RUNNER_TEMP/evidence/qa-canary.tap" test/fixtures/qa-canary/canary.test.mjs

      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}-node${{ matrix.node }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore

  # Pi's release binaries (pi.exe of PCLI included) run on Bun, not Node. Bun drops the async context in a worker's
  # message callback, so the codemode routing must hold there too: Pi's own CLI under Bun, faux model, one script.
  bun-codemode:
    name: bun-codemode (${{ matrix.os }}, bun ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # 1.3.14 is the runtime inside the Pi 1.4.0 release binaries
        bun: ["1.3.14", "1.4.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - run: bun --version

      - run: npm ci

      - name: Codemode script under Bun (write then read, 60 s limit)
        run: npm run test:bun

      - name: RQW-agent wait and codemode CLI under Bun (real CLI, faux models, no network)
        run: RQW_AGENT_BUN=1 node --import ./test/no-network.mjs --test extensions/RQW-agent/test/cli.test.ts

  windows-portable-git:
    name: windows-portable-git (node 22.19.0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - run: npm ci

      - name: Install PortableGit (per-user, no admin)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod https://api.github.com/repos/git-for-windows/git/releases/latest -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $asset = $rel.assets | Where-Object name -like 'PortableGit-*-64-bit.7z.exe' | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\pg.exe"
          Start-Process "$env:RUNNER_TEMP\pg.exe" -ArgumentList '-y', "-o`"$env:LOCALAPPDATA\Programs\Git`"" -Wait
          & "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe" --version

      - name: Tests (pwsh -> portable bash -> node, Program Files Git hidden)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\nowhere" | Out-Null
          $env:ProgramFiles = "$env:RUNNER_TEMP\nowhere"
          ${env:ProgramFiles(x86)} = "$env:RUNNER_TEMP\nowhere"
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike '*\Program Files\Git*' }) -join ';'
          $bash = "$env:LOCALAPPDATA\Programs\Git\bin\bash.exe"
          & $bash -lc 'command -v bash git node; cd "$GITHUB_WORKSPACE" && bash scripts/ci-npm-test.sh "$RUNNER_TEMP/evidence/npm-test.tap"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-windows-portable-git-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
