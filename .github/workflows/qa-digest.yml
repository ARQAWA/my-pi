name: qa-digest

on:
  schedule:
    # 09:30 and 21:30 Europe/Moscow, UTC+3, no DST.
    - cron: '30 6 * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Send a test digest even without failures
        type: boolean
        default: false
      dry_run:
        description: Print mail without sending
        type: boolean
        default: false

permissions:
  issues: read
  actions: read
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check mail secrets on every run
        env:
          QA_SMTP_USER: ${{ secrets.QA_SMTP_USER }}
          QA_SMTP_PASSWORD: ${{ secrets.QA_SMTP_PASSWORD }}
          QA_MAIL_TO: ${{ secrets.QA_MAIL_TO }}
        run: |
          missing=0
          for name in QA_SMTP_USER QA_SMTP_PASSWORD QA_MAIL_TO; do
            value="${!name}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Missing $name. Run: gh secret set $name -R ARQAWA/my-pi"
              missing=1
            fi
          done
          exit "$missing"
  digest:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Send failure digest
        env:
          GH_TOKEN: ${{ github.token }}
          QA_SMTP_USER: ${{ secrets.QA_SMTP_USER }}
          QA_SMTP_PASSWORD: ${{ secrets.QA_SMTP_PASSWORD }}
          QA_MAIL_TO: ${{ secrets.QA_MAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          node scripts/qa-digest.mjs --repo ARQAWA/my-pi "${args[@]}"
