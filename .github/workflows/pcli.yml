name: pcli

on:
  push:
    branches: [pcli]
    paths: ['pcli-vscode/**', 'extensions/RQW-mouse/**', '.github/workflows/pcli.yml']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ConPTY capture checks the bundled pi.exe, stock and with RQW-mouse.
  mouse:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synthetic package and tab tests
        run: node --test pcli-vscode/test/bundle.test.mjs pcli-vscode/test/update.test.mjs pcli-vscode/test/keybinding.test.mjs pcli-vscode/test/shell-tab.test.mjs

      - name: Bundled Pi and the VS Code test runner
        working-directory: pcli-vscode
        run: |
          npm install --no-audit --no-fund
          node fetch-pi.mjs

      - name: ConPTY capture, ?1000h count without and with RQW-mouse
        working-directory: pcli-vscode
        run: node test/mouse.mjs

      - name: Build VSIX
        working-directory: pcli-vscode
        run: |
          (yes || true) | npx --yes @vscode/vsce@latest package --target win32-x64 --skip-license --no-dependencies -o pcli.vsix
          ls -l pcli.vsix
          unzip -l pcli.vsix | grep -i 'pi\.exe'
          unzip -p pcli.vsix extension/my-pi/.revision
          unzip -l pcli.vsix | grep 'extension/my-pi/package.json'
          unzip -l pcli.vsix | grep 'extension/my-pi/node_modules/ws/package.json'
          manifest=$(unzip -p pcli.vsix extension.vsixmanifest)
          echo "$manifest" | grep -i '<Description'
          echo "$manifest" | grep -Eq '<Description[^>]*></Description>'
          echo "PASS empty <Description> in extension.vsixmanifest"

      - uses: actions/upload-artifact@v4
        with:
          name: pcli-vsix
          path: pcli-vscode/pcli.vsix
